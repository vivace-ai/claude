<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다정이 보호자 상황판</title>
<style>
  :root { --acc:#3b3fb6; --warm:#c96f4a; --red:#c2402f; --ink:#23263a; --bg:#faf9f6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans KR","Noto Sans CJK KR",sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  .app { max-width:560px; margin:0 auto; min-height:100vh; background:#fff; }
  header { padding:22px 22px 14px; border-bottom:1px solid #eceef4; }
  header h1 { margin:0; font-size:24px; }
  header p { margin:4px 0 0; font-size:16px; color:#2f7d5b; }
  section { padding:16px 22px; border-bottom:1px solid #eceef4; }
  h2 { margin:0 0 10px; font-size:18px; color:var(--acc); }
  .slots { display:flex; gap:8px; }
  .slot { flex:1; text-align:center; padding:12px 6px; border-radius:14px; background:#f2f3f8; color:#8a8fa3; }
  .slot.ok { background:#eef6f1; color:#2f7d5b; font-weight:700; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li { padding:10px 12px; border-radius:12px; background:#f2f3f8; }
  li.warn { background:#fbe9e6; color:var(--red); }
  .empty { color:#8a8fa3; }
</style>
</head>
<body>
<div class="app">
  <header><h1>오늘의 상황판</h1><p>보호자용 화면</p></header>
  <section><h2>오늘 복약</h2><div class="slots" id="meds"></div></section>
  <section><h2>보낸 알림</h2><ul id="alerts"></ul></section>
  <section><h2>마지막 대화 시각</h2><div id="last"></div></section>
</div>
<script>
async function load() {
  const log = await (await fetch('/api/log')).json();
  const last = await (await fetch('/api/last_chat')).json();
  const meds = document.getElementById('meds'); meds.replaceChildren();
  ['아침', '점심', '저녁'].forEach(s => {
    const ok = log.some(l => l.tool === 'record_medication' && l.slot === s && l.taken);
    const d = document.createElement('div'); d.className = 'slot' + (ok ? ' ok' : '');
    d.textContent = s + (ok ? ' ✓ 복용' : ' 미확인'); meds.appendChild(d);
  });
  const ul = document.getElementById('alerts'); ul.replaceChildren();
  const alerts = log.filter(l => l.tool === 'notify_guardian');
  if (!alerts.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = '보낸 알림이 없어요'; ul.appendChild(li); }
  alerts.forEach(l => {
    const li = document.createElement('li'); if (l.level === '주의') li.className = 'warn';
    li.textContent = l.time + ' [' + l.level + '] ' + l.summary; ul.appendChild(li);
  });
  document.getElementById('last').textContent = last.time || '아직 대화가 없어요';
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
